apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-http
  namespace: memory-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memory-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        # An empty Pod selector here selects Pods in this policy's namespace.
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
