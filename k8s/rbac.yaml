apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memory-app-support
  namespace: memory-app
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-app-support
  namespace: memory-app
subjects:
  # Authentication must supply this group; this does not create a human login.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: memory-app-support
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memory-app-support
