apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app-py312
  namespace: memory-app
  labels:
    app.kubernetes.io/name: memory-app
    app.kubernetes.io/instance: memory-app-py312
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-app
      app.kubernetes.io/instance: memory-app-py312
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-app
        app.kubernetes.io/instance: memory-app-py312
        app.kubernetes.io/version: "py3.12-sha-f1d12abd9ff4446cba5999ec973c497c2fc7d011"
    spec:
      serviceAccountName: memory-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: memory-app
      initContainers:
        - name: validate-runtime
          image: busybox:1.37.0-musl
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test "$PYTHONUNBUFFERED" = "1"
              test "$PYTHONDONTWRITEBYTECODE" = "1"
              echo "Runtime configuration validated"
          envFrom:
            - configMapRef:
                name: memory-app-runtime
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: memory-app
          image: ghcr.io/akshay228437/devops-sre:py3.12-sha-f1d12abd9ff4446cba5999ec973c497c2fc7d011
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: memory-app-runtime
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 400Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

