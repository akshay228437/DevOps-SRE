name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'Docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Image (Python ${{ matrix.python-version }})
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Define image tag
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:py${PYTHON_VERSION}-sha-${COMMIT_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build image
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: docker build --pull --build-arg PYTHON_VERSION="$PYTHON_VERSION" -t "$IMAGE" .

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE"

      - name: Show published image
        run: |
          echo "Published image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  update-manifests:
    name: Open image update PR
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Update all three image tags
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: python3 scripts/update-image-tags.py --repository "$REPOSITORY" --sha "$RELEASE_SHA"

      - name: Commit image tags and open PR
        id: update-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codex/update-images-${{ github.event.pull_request.merge_commit_sha }}
          add-paths: k8s/deployment-*.yaml
          commit-message: "chore: update application images to ${{ github.event.pull_request.merge_commit_sha }}"
          title: "Deploy images from ${{ github.event.pull_request.merge_commit_sha }}"
          body: |
            Updates the Python 3.12, 3.13, and 3.14 Deployments to images published
            from commit ${{ github.event.pull_request.merge_commit_sha }}.

            All three release builds, vulnerability scans, and pushes completed successfully.
            Review the image references and required checks before merging.
            This manifest-only PR does not trigger another image release.

      - name: Show image update PR
        env:
          PR_URL: ${{ steps.update-pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Image update PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No manifest changes; no new PR required." >> "$GITHUB_STEP_SUMMARY"
          fi
