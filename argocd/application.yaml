apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akshay228437/DevOps-SRE.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: memory-app
  # Leave automated sync disabled until the first deployment is verified.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
